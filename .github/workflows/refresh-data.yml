name: refresh data

# Refresh current rosters and games played so far, re-export the website data,
# commit it if anything changed, and redeploy. The forecasts stay fixed.
#
# Manual only: stats.nba.com doesn't respond to GitHub's servers (requests time
# out), so the daily refresh runs on a home computer instead (scripts/refresh.sh).
# This is kept for trying again from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install nba_api pandas numpy pyarrow scikit-learn lightgbm shap && pip install -e .
      - run: python -m next82.data --current
      - run: python -m next82.export
      - id: commit
        run: |
          git add data/raw/current_rosters data/raw/current_season web/public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh rosters and games so far"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
